[package]
name = "semantic-deformation-controls"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bin]]
name = "face-width-targets"
path = "src/main.rs"

[[bin]]
name = "jaw-arc-targets"
path = "src/jaw_arc_main.rs"
